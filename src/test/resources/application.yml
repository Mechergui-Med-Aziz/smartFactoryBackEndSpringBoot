otp:
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  resend-delay-seconds: ${OTP_RESEND_DELAY_SECONDS:60}
  reset-token-expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:15}

jwt:
